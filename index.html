// ============================================================
// PARTICLE SYSTEM
// ============================================================
const particles = [];

function spawnParticles(x, y, count, colors, spdX, spdY, life, size) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 0.5 + Math.random() * 2.5;
    particles.push({
      x: x + (Math.random()-0.5)*16,
      y: y + (Math.random()-0.5)*10,
      vx: Math.cos(angle)*spd * spdX,
      vy: Math.sin(angle)*spd * spdY - Math.random()*1.5,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: life*(0.7+Math.random()*0.6),
      maxLife: life,
      size: size*(0.4+Math.random()*0.8),
      gravity: 0.09,
      rot: Math.random()*Math.PI*2,
      rotV: (Math.random()-0.5)*0.2,
      shape: Math.random()<0.5 ? 'sq' : 'circ',
    });
  }
}

function spawnConfetti() {
  const cols = [RED,GREEN,YELLOW,CYAN,ORANGE,'#f080f0',WHITE,'#80f0f0'];
  for (let i=0;i<80;i++) {
    particles.push({
      x: Math.random()*SCREEN_W,
      y: -20 - Math.random()*60,
      vx: (Math.random()-0.5)*2.5,
      vy: 1.5+Math.random()*3,
      color: cols[Math.floor(Math.random()*cols.length)],
      life: 150+Math.random()*80,
      maxLife: 230,
      size: 4+Math.random()*5,
      gravity: 0.02,
      rot: Math.random()*Math.PI*2,
      rotV: (Math.random()-0.5)*0.25,
      shape: 'sq',
    });
  }
}

function updateParticles() {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity;
    p.vx*=0.97;
    p.rot+=p.rotV;
    p.life--;
    if (p.life<=0) particles.splice(i,1);
  }
}

function drawParticles(ctx) {
  for (const p of particles) {
    const alpha = Math.min(1, p.life/p.maxLife * 2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.shape==='sq') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}

// ============================================================
// SCREEN SHAKE
// ============================================================
let shakeX=0, shakeY=0, shakeInt=0, shakeDur=0;
function addShake(intensity, duration) {
  shakeInt=Math.max(shakeInt,intensity);
  shakeDur=Math.max(shakeDur,duration);
}
function updateShake() {
  if (shakeDur>0) {
    shakeX=(Math.random()-0.5)*shakeInt*2;
    shakeY=(Math.random()-0.5)*shakeInt*2;
    shakeInt*=0.88; shakeDur--;
  } else { shakeX=0; shakeY=0; }
}

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx=null;
function initAudio() {
  if (!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function playNote(freq, dur, type='square', vol=0.12, delay=0) {
  if (!audioCtx) return;
  try {
    const now=audioCtx.currentTime+delay;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type=type;
    osc.frequency.setValueAtTime(freq,now);
    gain.gain.setValueAtTime(0,now);
    gain.gain.linearRampToValueAtTime(vol,now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,now+dur);
    osc.start(now); osc.stop(now+dur+0.05);
  } catch(e){}
}

function sndWrong()   { playNote(180,0.18,'sawtooth',0.15); playNote(140,0.25,'sawtooth',0.12,0.1); }
function sndStun()    { playNote(300,0.08,'square',0.18); playNote(200,0.2,'sawtooth',0.15,0.08); }
function sndSlowed()  { playNote(350,0.15,'sine',0.1); }

// ============================================================
// CLOUDS
// ============================================================
const clouds=[];
function initClouds() {
  for(let i=0;i<7;i++) clouds.push({x:Math.random()*SCREEN_W,y:15+Math.random()*70,w:50+Math.random()*80,spd:0.12+Math.random()*0.18,a:0.08+Math.random()*0.12});
}
function updateClouds() { for(const c of clouds){c.x+=c.spd;if(c.x>SCREEN_W+c.w)c.x=-c.w;} }
function drawClouds(ctx) {
  ctx.save();
  for(const c of clouds){
    ctx.globalAlpha=c.a;
    ctx.fillStyle=WHITE;
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.w*0.32,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.28,c.y-c.w*0.14,c.w*0.24,0,Math.PI*2);
    ctx.arc(c.x+c.w*0.52,c.y,c.w*0.26,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// DRAW UTILITIES
// ============================================================
function fillRect(ctx,x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}

function drawText(ctx,x,y,msg,size=10,color=WHITE,anchor="nw"){
  ctx.fillStyle=color;
  ctx.font=`bold ${size}px "Courier New",monospace`;
  ctx.textBaseline="top";
  ctx.textAlign=(anchor==="center"||anchor==="n")?"center":"left";
  ctx.fillText(msg,x,y);
  ctx.textAlign="left";
}

function drawTextOutline(ctx,x,y,msg,size,color,outline="#000",anchor="nw"){
  ctx.font=`bold ${size}px "Courier New",monospace`;
  ctx.textBaseline="top";
  ctx.textAlign=(anchor==="center"||anchor==="n")?"center":"left";
  ctx.fillStyle=outline;
  for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++) if(ox||oy) ctx.fillText(msg,x+ox,y+oy);
  ctx.fillStyle=color;
  ctx.fillText(msg,x,y);
  ctx.textAlign="left";
}

function shadow(ctx,x,y,w){
  ctx.save();ctx.globalAlpha=0.2;ctx.fillStyle="#000";
  ctx.beginPath();ctx.ellipse(x+w/2,y+5,w*0.45,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ============================================================
function drawGrass(ctx,x,y){
  const c=(Math.floor(x/TILE)+Math.floor(y/TILE))%2===0?GRASS:GRASS2;
  fillRect(ctx,x,y,TILE,TILE,c);
  ctx.fillStyle=LEAVES2;
  ctx.fillRect(x+4,y+26,2,4);ctx.fillRect(x+14,y+24,2,5);ctx.fillRect(x+23,y+27,2,3);
}
function drawPath(ctx,x,y){
  const c=(Math.floor(x/TILE)+Math.floor(y/TILE))%2===0?PATH:PATH2;
  fillRect(ctx,x,y,TILE,TILE,c);
  ctx.fillStyle='rgba(0,0,0,0.06)';
  ctx.fillRect(x+2,y+2,3,3);ctx.fillRect(x+18,y+18,3,3);
}
function drawWater(ctx,x,y,anim){
  fillRect(ctx,x,y,TILE,TILE,WATER);
  const w=Math.sin(anim*0.05+x*0.12)*2;
  fillRect(ctx,x,y+7+w,TILE,3,WATER2);
  fillRect(ctx,x,y+17+w,TILE,3,WATER3);
  fillRect(ctx,x,y+25-w,TILE,2,WATER2);
  if((anim+Math.floor(x/TILE)*11)%70<8){ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillRect(x+20,y+11,2,2);}
}
function drawTree(ctx,x,y){
  shadow(ctx,x+6,y+30,20);
  fillRect(ctx,x+13,y+22,6,10,TRUNK);
  fillRect(ctx,x+14,y+23,4,9,'#3c2008');
  fillRect(ctx,x+2,y+14,28,12,LEAVES2);
  fillRect(ctx,x+6,y+7,20,12,LEAVES);
  fillRect(ctx,x+10,y+2,12,9,LEAVES3);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(x+13,y+4,4,4);
}
function drawBench(ctx,x,y){
  shadow(ctx,x+2,y+27,28);
  fillRect(ctx,x+2,y+14,28,5,BENCH_F);
  fillRect(ctx,x+2,y+8,28,4,'#b07038');
  ctx.fillStyle='#7a4010';ctx.fillRect(x+11,y+8,1,4);ctx.fillRect(x+21,y+8,1,4);
  fillRect(ctx,x+4,y+19,5,8,BENCH_S);

  ctx.fillStyle=PLAYER2_C;ctx.fillRect(x+5,y+14,14,2);ctx.fillRect(x+5,y+17,14,2);

  // Eyes

  if(stunTimer>0){

    ctx.fillRect(x+8,y+6,3,3);ctx.fillRect(x+14,y+6,3,3);
    ctx.fillStyle=WHITE;ctx.fillRect(x+9,y+6,1,1);ctx.fillRect(x+15,y+6,1,1);
    ctx.fillStyle='#1a1030';ctx.fillRect(x+10,y+7,1,1);ctx.fillRect(x+16,y+7,1,1);

class Player {
  constructor(x,y){
    this.x=x;this.y=y;this.w=24;this.h=32;
    this.vx=0;this.vy=0;this.inventory=[];
    this.frame=0;this.facing=1;
    this.slowTimer=0;this.slowCooldown=0;
    this.stunTimer=0;this.stunCooldown=0;
  }
  cx(){return this.x+this.w/2;} cy(){return this.y+this.h/2;}
  canPickup(){return this.inventory.length<INVENTORY_SIZE;}
  pickup(kind){if(this.canPickup()){this.inventory.push(kind);return true;}return false;}
  setVelocity(keys){
    if(this.stunTimer>0){this.vx=0;this.vy=0;return;}
    let spd=PLAYER_SPEED;
    if(this.slowTimer>0) spd*=SQUIRREL_SLOW;
    this.vx=0;this.vy=0;
    if(keys.has("ArrowLeft")||keys.has("a")) this.vx-=spd;
    if(keys.has("ArrowRight")||keys.has("d")) this.vx+=spd;
    if(keys.has("ArrowUp")||keys.has("w")) this.vy-=spd;
    if(keys.has("ArrowDown")||keys.has("s")) this.vy+=spd;
    if(this.vx!==0&&this.vy!==0){this.vx*=0.707;this.vy*=0.707;}
    if(this.vx>0) this.facing=1; else if(this.vx<0) this.facing=-1;
  }
  update(walls){
    if(this.slowTimer>0) this.slowTimer-=1/60;
    if(this.slowCooldown>0) this.slowCooldown-=1/60;
    if(this.stunTimer>0) this.stunTimer-=1/60;
    if(this.stunCooldown>0) this.stunCooldown-=1/60;
    this.x+=this.vx; this._fixX(walls);
    this.y+=this.vy; this._fixY(walls);
    this.x=Math.max(0,Math.min(SCREEN_W-this.w,this.x));
    this.y=Math.max(0,Math.min(SCREEN_H-this.h-60,this.y));
    if(Math.abs(this.vx)>0.5||Math.abs(this.vy)>0.5) this.frame++;
  }
  _touch(ox1,oy1,ox2,oy2){return this.x<ox2&&this.x+this.w>ox1&&this.y<oy2&&this.y+this.h>oy1;}
  _fixX(walls){for(const[wx,wy,wx2,wy2]of walls){if(this._touch(wx,wy,wx2,wy2)){if(this.vx>0)this.x=wx-this.w;else if(this.vx<0)this.x=wx2;}}}
  _fixY(walls){for(const[wx,wy,wx2,wy2]of walls){if(this._touch(wx,wy,wx2,wy2)){if(this.vy>0)this.y=wy-this.h;else if(this.vy<0)this.y=wy2;}}}
  near(ox1,oy1,ox2,oy2,m=12){const cx1=this.cx()-m,cy1=this.cy()-m,cx2=this.cx()+m,cy2=this.cy()+m;return cx1<ox2&&cx2>ox1&&cy1<oy2&&cy2>oy1;}
}

class Item {
  constructor(kind,x,y){this.kind=kind;this.x=x;this.y=y;this.w=28;this.h=28;this.picked=false;this.bob=Math.random()*Math.PI*2;}
  cx(){return this.x+this.w/2;} cy(){return this.y+this.h/2;}
  update(){this.bob+=0.045;}
  drawY(){return this.y+Math.round(Math.sin(this.bob)*3);}
}

class Bin {
  constructor(kind,x,y){this.kind=kind;this.x=x;this.y=y;this.w=32;this.h=32;this.flash=0;}
  accepts(kind){
    if(this.kind===BIN_TRASH) return [KIND_TRASH,KIND_LEAF,KIND_SIGN].includes(kind);
    return kind===KIND_CAN;
  }
  update(){if(this.flash>0)this.flash--;}
}

class Puddle{constructor(x,y){this.x=x;this.y=y;this.w=32;this.h=20;}}

class Squirrel{
  constructor(x,y,patrol=96){
    this.x=x;this.y=y;this.w=24;this.h=24;
    this.patrol=patrol;this.speed=1.5;this.dir=1;this.moved=0;
  }
  cx(){return this.x+this.w/2;} cy(){return this.y+this.h/2;}
  update(){
    const mv=this.speed*this.dir;
    this.x+=mv;this.moved+=Math.abs(mv);
    if(this.moved>=this.patrol){this.dir*=-1;this.moved=0;}
  }
}

class Level {
  constructor(number){
    this.number=number;
    const data=LEVEL_DATA[number];
    const tileMap=MAPS[number];
    this.goalCount=data.goal;
    this.description=data.desc;
    this.timeLimit=LEVEL_TIMES[number];
    this.walls=[];this.bgTiles=[];
    for(let ri=0;ri<tileMap.length;ri++){
      for(let ci=0;ci<tileMap[ri].length;ci++){
        const ch=tileMap[ri][ci];
        const x=ci*TILE,y=ri*TILE;
        if(ch==='T'){this.walls.push([x,y,x+TILE,y+TILE]);this.bgTiles.push(["tree",x,y]);}
        else if(ch==='~'){this.walls.push([x,y,x+TILE,y+TILE]);this.bgTiles.push(["water",x,y]);}
        else if(ch==='B'){this.walls.push([x,y,x+TILE,y+TILE]);this.bgTiles.push(["bench",x,y]);}
        else if(ch==='.') this.bgTiles.push(["path",x,y]);
        else this.bgTiles.push(["grass",x,y]);
      }
    }
    this.items=data.items.map(([k,c,r])=>new Item(k,c*TILE,r*TILE));
    this.bins=data.bins.map(([k,c,r])=>new Bin(k,c*TILE,r*TILE));
    this.puddles=data.puddles.map(([c,r])=>new Puddle(c*TILE,r*TILE));
    this.squirrels=data.squirrels.map(([c,r,p])=>new Squirrel(c*TILE,r*TILE,p));
  }
  itemsLeft(){return this.items.filter(i=>!i.picked);}
  itemsCollected(){return this.items.filter(i=>i.picked).length;}
}

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const game={
  state:TITLE,
  score:0,levelNo:1,
  level:null,player:null,
  timeLeft:0,keys:new Set(),
  anim:0,feedback:[],
  descTimer:0,timeBonus:0,
  immuneShown:false,lastTime:null,
  combo:0,comboTimer:0,
  timeLowPlayed:false,
  titleAnim:0,

  startLevel(n){
    this.levelNo=n;
    this.level=new Level(n);
    this.player=new Player(SCREEN_W/2,SCREEN_H/2-20);
    this.timeLeft=LEVEL_TIMES[n];
    this.feedback=[];
    this.descTimer=180;
    if(n===1) this.score=0;
    this.combo=0;this.comboTimer=0;
    this.timeLowPlayed=false;
    particles.length=0;
    this.state=PLAYING;
  },

  addMsg(text,color,x,y,ttl=72){
    this.feedback.push({text,color,x:Math.round(x),y:Math.round(y),ttl,maxTtl:ttl});
  },

  interact(){
    initAudio();
    const p=this.player,lv=this.level,reach=38;
    if(p.inventory.length>0){
      for(const b of lv.bins){
        if(p.near(b.x,b.y,b.x+b.w,b.y+b.h,reach)){
          const kept=[];let deposited=0;
          for(const kind of p.inventory){
            if(b.accepts(kind)){
              this.score+=SCORE_CORRECT;deposited++;
            } else {
              this.score=Math.max(0,this.score+SCORE_WRONG);
              kept.push(kind);
              this.addMsg("Wrong bin! -5",RED,b.x+16,b.y-12);
              addShake(5,12);
              spawnParticles(b.x+16,b.y,[RED,'#ff8888','#ff4444'],8,1.5,1.5,35,4);
              sndWrong();
            }
          }
          p.inventory=kept;
          if(deposited>0){
            b.flash=20;
            this.addMsg("+"+deposited*SCORE_CORRECT,GREEN,b.x+16,b.y-12);
            spawnParticles(b.x+16,b.y,[GREEN,YELLOW,WHITE,CYAN],deposited*5,2,2,50,5);
            sndDeposit();
            this.combo=0;this.comboTimer=0;
          }
          return;
        }
      }
    }
    for(const item of lv.itemsLeft()){
      if(p.near(item.x,item.y,item.x+item.w,item.y+item.h,reach)){
        if(p.canPickup()){
          item.picked=true;p.pickup(item.kind);
          this.score+=SCORE_ITEM;
          this.combo++;this.comboTimer=3.5;
          spawnParticles(item.cx(),item.drawY(),[YELLOW,WHITE,CYAN,'#ffff80'],12,2,2,45,4);
          sndPickup();
          if(this.combo>=2){
            const comboLabels=['','','Double!','Triple!','MEGA!'];
            this.addMsg(comboLabels[Math.min(this.combo,4)]+'  +'+(this.combo*5),ORANGE,p.cx(),p.y-20);
            this.score+=this.combo*5;
            sndCombo(this.combo);
          }
          const names={trash:"Paper",can:"Can",leaf:"Leaf",sign:"Sign"};
          this.addMsg("+"+SCORE_ITEM,YELLOW,item.cx(),item.drawY()-10);
        } else {
          this.addMsg("Inventory full!",ORANGE,p.cx(),p.y-10);
        }
        return;
      }
    }
  },

  update(dt){
    this.anim++;
    if(this.state===TITLE){this.titleAnim++;updateClouds();return;}
    if(this.state!==PLAYING) return;
    const p=this.player,lv=this.level;
    this.timeLeft-=dt;
    if(this.timeLeft<=0){this.timeLeft=0;this.state=GAME_OVER;sndGameOver();return;}
    if(this.timeLeft<10&&!this.timeLowPlayed&&Math.floor(this.timeLeft*4)%4===0) sndTimeLow();
    // Combo timer
    if(this.comboTimer>0){this.comboTimer-=dt;if(this.comboTimer<=0)this.combo=0;}
    p.setVelocity(this.keys);
    p.update(lv.walls);
    for(const item of lv.items) item.update();
    for(const b of lv.bins) b.update();
    for(const sq of lv.squirrels) sq.update();
    updateClouds();
    // Puddles
    for(const pu of lv.puddles){
      if(p.near(pu.x,pu.y,pu.x+pu.w,pu.y+pu.h,8)){
        if(p.slowCooldown<=0){
          p.slowTimer=Math.max(p.slowTimer,3.5);p.slowCooldown=4.5;
          this.addMsg("Slowed!",CYAN,p.cx(),p.y-10);
          sndSlowed();
        }
      }
    }
    // Squirrels
    let sqHit=false;
    for(const sq of lv.squirrels){
      if(p.near(sq.x,sq.y,sq.x+sq.w,sq.y+sq.h,15)){
        sqHit=true;
        if(p.stunCooldown<=0){
          p.stunTimer=Math.max(p.stunTimer,1.5);p.stunCooldown=2.75;
          this.addMsg("Stunned!",ORANGE,p.cx(),p.y-10);
          addShake(8,18);
          spawnParticles(p.cx(),p.cy(),[ORANGE,YELLOW,WHITE],10,2.5,2.5,30,4);
          sndStun();this.immuneShown=false;
        } else if(!this.immuneShown){
          this.addMsg("Immune",CYAN,p.cx(),p.y-10);this.immuneShown=true;
        }
        break;
      }
    }
    if(!sqHit) this.immuneShown=false;
    this.feedback=this.feedback.filter(m=>{m.ttl--;return m.ttl>0;});
    if(this.descTimer>0) this.descTimer--;
    updateParticles();
    updateShake();
    if(lv.itemsLeft().length===0&&p.inventory.length===0){
      const bonus=Math.floor(this.timeLeft*SCORE_BONUS);
      this.score+=bonus;this.timeBonus=bonus;
      this.state=LVL_DONE;
      sndLevelComplete();
      spawnConfetti();
    }
  },

  draw(){
    ctx.fillStyle=DARK;ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    if(this.state===TITLE){this.drawTitle();return;}
    ctx.save();ctx.translate(shakeX,shakeY);
    this.drawGame();
    ctx.restore();
    if(this.state===PAUSED) this.drawPaused();
    else if(this.state===LVL_DONE) this.drawLevelDone();
    else if(this.state===GAME_OVER) this.drawGameOver();
    else if(this.state===WIN) this.drawWin();
  },

  drawGame(){
    const lv=this.level,p=this.player;
    if(!lv||!p) return;
    drawClouds(ctx);
    for(const[kind,x,y]of lv.bgTiles){
      if(kind==="grass") drawGrass(ctx,x,y);
      else if(kind==="path") drawPath(ctx,x,y);
      else if(kind==="water") drawWater(ctx,x,y,this.anim);
      else if(kind==="tree") drawTree(ctx,x,y);
      else if(kind==="bench") drawBench(ctx,x,y);
      else if(kind==="sign") drawSign(ctx,x,y);
    }
    for(const pu of lv.puddles) drawPuddle(ctx,pu.x,pu.y,this.anim);
    for(const item of lv.itemsLeft()) drawItemSprite(ctx,item.kind,item.x,item.drawY());
    for(const b of lv.bins){
      const fl=b.flash>0&&Math.floor(b.flash/3)%2===0;
      drawBin(ctx,b.x,b.y,b.kind,fl);
    }
    for(const sq of lv.squirrels) drawSquirrel(ctx,Math.round(sq.x),Math.round(sq.y),sq.dir);
    drawParticles(ctx);
    drawPlayer(ctx,Math.round(p.x),Math.round(p.y),p.frame,p.inventory.length,p.facing,p.stunTimer,p.slowTimer);
    for(const{text,color,x,y,ttl,maxTtl}of this.feedback){
      const off=Math.floor((maxTtl-ttl)/2.5);
      const alpha=Math.min(1,ttl/20);
      ctx.save();ctx.globalAlpha=alpha;
      drawTextOutline(ctx,x,y-off,text,10,color,BLACK,"center");
      ctx.restore();
    }
    drawHUD(ctx,this.score,this.levelNo,this.timeLeft,p.inventory,lv.itemsCollected(),lv.goalCount,p.slowTimer,p.stunTimer,this.combo);
    if(this.descTimer>0){
      const alpha=Math.min(1,this.descTimer/30);
      ctx.save();ctx.globalAlpha=alpha;
      const by=SCREEN_H/2-70;
      fillRect(ctx,SCREEN_W/2-260,by-8,520,90,'rgba(0,0,0,0.75)');
      ctx.strokeStyle='#2a6040';ctx.lineWidth=2;ctx.strokeRect(SCREEN_W/2-260,by-8,520,90);
      drawTextOutline(ctx,SCREEN_W/2,by,lv.description,13,YELLOW,BLACK,"n");
      drawTextOutline(ctx,SCREEN_W/2,by+24,'T bin = paper, leaves, signs',10,CYAN,BLACK,"n");
      drawTextOutline(ctx,SCREEN_W/2,by+42,'R bin = cans only',10,GREEN,BLACK,"n");
      ctx.restore();
    }
  },

  drawOverlay(bx,by,bw,bh,border='#2a4a3a'){
    ctx.fillStyle="rgba(0,0,0,0.65)";ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    fillRect(ctx,bx,by,bw,bh,'#0a1a12');
    ctx.strokeStyle=border;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
    // Corner decorations
    const deco=6;ctx.fillStyle=border;
    ctx.fillRect(bx,by,deco,deco);ctx.fillRect(bx+bw-deco,by,deco,deco);
    ctx.fillRect(bx,by+bh-deco,deco,deco);ctx.fillRect(bx+bw-deco,by+bh-deco,deco,deco);
  },

  drawPaused(){
    const bw=380,bh=200,bx=(SCREEN_W-380)/2,by=(SCREEN_H-200)/2;
    this.drawOverlay(bx,by,bw,bh);
    drawTextOutline(ctx,SCREEN_W/2,by+16,'PAUSED',22,YELLOW,BLACK,"n");
    const items=["P — Resume","R — Restart Level","ESC — Back to Title"];
    items.forEach((l,i)=>drawText(ctx,SCREEN_W/2,by+72+i*34,l,10,WHITE,"n"));
  },

  drawLevelDone(){
    const bw=500,bh=280,bx=(SCREEN_W-500)/2,by=(SCREEN_H-280)/2;
    this.drawOverlay(bx,by,bw,bh,'#28a850');
    drawParticles(ctx);
    drawTextOutline(ctx,SCREEN_W/2,by+14,'LEVEL COMPLETE!',20,YELLOW,BLACK,"n");
    const star=Math.floor(this.anim/20)%2===0?'★':'☆';
    drawText(ctx,SCREEN_W/2,by+50,star+' GREAT JOB! '+star,12,YELLOW,"n");
    drawText(ctx,SCREEN_W/2,by+90,'Level '+this.levelNo+' cleared!',11,WHITE,"n");
    drawText(ctx,SCREEN_W/2,by+116,'Score: '+String(this.score).padStart(6,'0'),11,CYAN,"n");
    drawText(ctx,SCREEN_W/2,by+142,'Time bonus: +'+this.timeBonus,11,GREEN,"n");
    if(Math.floor(this.anim/25)%2===0)
      drawTextOutline(ctx,SCREEN_W/2,by+200,'PRESS ENTER — Next Level',11,CYAN,BLACK,"n");
  },

  drawGameOver(){
    const bw=460,bh=260,bx=(SCREEN_W-460)/2,by=(SCREEN_H-260)/2;
    this.drawOverlay(bx,by,bw,bh,RED);
    drawTextOutline(ctx,SCREEN_W/2,by+16,"TIME'S UP!",22,RED,BLACK,"n");
    drawText(ctx,SCREEN_W/2,by+76,'Level '+this.levelNo,12,WHITE,"n");
    drawText(ctx,SCREEN_W/2,by+106,'Score: '+String(this.score).padStart(6,'0'),12,YELLOW,"n");
    drawText(ctx,SCREEN_W/2,by+134,'Items collected: '+this.level.itemsCollected()+'/'+this.level.goalCount,10,'#a0b0a0',"n");
    if(Math.floor(this.anim/28)%2===0)
      drawText(ctx,SCREEN_W/2,by+190,'R — Try Again   ESC — Title',10,CYAN,"n");
  },

  drawWin(){
    ctx.fillStyle='#001800';ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    // Ground
    fillRect(ctx,0,SCREEN_H-110,SCREEN_W,110,GRASS);
    fillRect(ctx,0,SCREEN_H-114,SCREEN_W,6,LEAVES2);
    for(let tx=0;tx<SCREEN_W;tx+=80) drawTree(ctx,tx,SCREEN_H-158);
    drawParticles(ctx);
    const bw=580,bh=240,bx=(SCREEN_W-580)/2,by=56;
    fillRect(ctx,bx,by,bw,bh,'#050f05');
    ctx.strokeStyle=GREEN;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
    drawTextOutline(ctx,SCREEN_W/2,by+16,'YOU WIN!',28,YELLOW,BLACK,"n");
    drawText(ctx,SCREEN_W/2,by+70,'The park is clean! Great work!',12,GREEN,"n");
    drawText(ctx,SCREEN_W/2,by+100,'Final Score: '+String(this.score).padStart(6,'0'),13,CYAN,"n");
    // Stars
    for(let s=0;s<5;s++){
      const sx=SCREEN_W/2-80+s*40;
      const st=s<Math.round(this.score/2000+2)?'★':'☆';
      const sc=s<Math.round(this.score/2000+2)?YELLOW:'#404040';
      drawText(ctx,sx,by+128,st,18,sc,"nw");
    }
    if(Math.floor(this.anim/28)%2===0)
      drawText(ctx,SCREEN_W/2,by+185,'ENTER — Play Again',11,WHITE,"n");
    const dancers=[280,400,520];
    dancers.forEach((px,i)=>{
      const dy=Math.round(Math.sin(this.anim*0.1+i*1.2)*12);
      drawPlayer(ctx,px,SCREEN_H-108+dy,this.anim+i*22,0,i%2===0?1:-1,0,0);
    });
  },

  drawTitle(){
    const a=this.titleAnim;
    // Sky gradient (simple)
    ctx.fillStyle='#0a1a0a';ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    // Draw grass strip
    fillRect(ctx,0,SCREEN_H-140,SCREEN_W,140,GRASS);
    fillRect(ctx,0,SCREEN_H-144,SCREEN_W,6,LEAVES2);
    for(let tx=-20;tx<SCREEN_W+60;tx+=80){
      const sway=Math.round(Math.sin(a*0.02+tx*0.01)*2);
      drawTree(ctx,tx,SCREEN_H-178+sway);
    }
    drawClouds(ctx);
    // Items bouncing on screen
    const titleItems=[
      {kind:KIND_TRASH,x:120,phase:0},{kind:KIND_CAN,x:220,phase:1.2},
      {kind:KIND_LEAF,x:580,phase:0.7},{kind:KIND_SIGN,x:680,phase:2.1}
    ];
    for(const ti of titleItems){
      const bob=Math.sin(a*0.05+ti.phase)*8;
      drawItemSprite(ctx,ti.kind,ti.x,80+bob);
    }
    // Title box
    const bw=520,bh=80,bx=(SCREEN_W-bw)/2,by=32;
    fillRect(ctx,bx,by,bw,bh,'rgba(0,0,0,0.7)');
    ctx.strokeStyle=GREEN;ctx.lineWidth=3;ctx.strokeRect(bx,by,bw,bh);
    // Title text
    drawTextOutline(ctx,SCREEN_W/2,by+6,'PIXEL PARK CLEANUP',28,YELLOW,BLACK,"n");
    drawText(ctx,SCREEN_W/2,by+44,'SORT. RECYCLE. RESTORE.',11,GREEN,"n");
    // Player demo
    const pdy=Math.round(Math.sin(a*0.07)*4);
    drawPlayer(ctx,360,SCREEN_H-148+pdy,a,0,1,0,0);
    // Info panel
    const pw=500,ph=170,px2=(SCREEN_W-pw)/2,py2=220;
    fillRect(ctx,px2,py2,pw,ph,'rgba(0,0,0,0.75)');
    ctx.strokeStyle='#2a5a2a';ctx.lineWidth=2;ctx.strokeRect(px2,py2,pw,ph);
    drawText(ctx,SCREEN_W/2,py2+10,'HOW TO PLAY',12,CYAN,"n");
    const lines=[
      'Pick up litter scattered around the park',
      'Sort it: T bin = trash/leaves/signs',
      '         R bin = cans & recyclables',
      'Beat the timer to complete each level!',
      '7 Levels of increasing challenge'
    ];
    lines.forEach((l,i)=>drawText(ctx,px2+18,py2+32+i*22,l,9,'#a8c8a8',"nw"));
    // Blinking start prompt
    if(Math.floor(a/22)%2===0){
      fillRect(ctx,px2,py2+ph-30,pw,30,'#0a280a');
      drawTextOutline(ctx,SCREEN_W/2,py2+ph-22,'PRESS ENTER TO START',12,GREEN,BLACK,"n");
    }
    // Credits
    drawText(ctx,SCREEN_W/2,SCREEN_H-18,'Monroe Township High School — TSA 2025-2026',8,'#2a4a2a',"n");
  },

  keyDown(e){
    initAudio();
    this.keys.add(e.key);
    const k=e.key;
    if(this.state===TITLE){
      if(k==='Enter'||k===' '){e.preventDefault();this.score=0;this.startLevel(1);}
      return;
    }
    if(this.state===PLAYING){
      if(k==='p'||k==='P') this.state=PAUSED;
      else if(k==='r'||k==='R') this.startLevel(this.levelNo);
      else if(k==='Escape'){this.score=0;particles.length=0;this.state=TITLE;}
      else if(k===' '){e.preventDefault();this.interact();}
    } else if(this.state===PAUSED){
      if(k==='p'||k==='P') this.state=PLAYING;
      else if(k==='r'||k==='R') this.startLevel(this.levelNo);
      else if(k==='Escape'){this.score=0;particles.length=0;this.state=TITLE;}
    } else if(this.state===LVL_DONE){
      if(k==='Enter'){
        if(this.levelNo>=MAX_LEVEL) this.state=WIN;
        else this.startLevel(this.levelNo+1);
      } else if(k==='Escape'){this.score=0;particles.length=0;this.state=TITLE;}
    } else if(this.state===GAME_OVER){
      if(k==='r'||k==='R') this.startLevel(this.levelNo);
      else if(k==='Escape'){this.score=0;particles.length=0;this.state=TITLE;}
    } else if(this.state===WIN){
      if(k==='Enter'){this.score=0;particles.length=0;this.startLevel(1);}
      else if(k==='Escape'){this.score=0;particles.length=0;this.state=TITLE;}
    }
  },
  keyUp(e){this.keys.delete(e.key);}
};

// ============================================================
// INIT & LOOP
// ============================================================
window.addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  game.keyDown(e);
});
window.addEventListener("keyup",e=>game.keyUp(e));

initClouds();

function loop(ts){
  if(!game.lastTime) game.lastTime=ts;
  const dt=Math.min((ts-game.lastTime)/1000,0.05);
  game.lastTime=ts;
  game.update(dt);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
